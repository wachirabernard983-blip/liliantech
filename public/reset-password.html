<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d5dfc"><title>Reset password — LilianTech</title><link rel="stylesheet" href="/styles.css"></head>
<body class="public-page page-enter">
<header class="site-header"><div class="container nav"><a class="brand" href="/" aria-label="LilianTech home">Lilian<span>Tech</span></a><nav class="desktop-nav" aria-label="Main navigation"><a href="/#how">How it works</a><a href="/#payouts">Payouts</a><a href="/login.html">Log in</a><a class="button primary" href="/register.html">Get started</a></nav><button class="mobile-menu" type="button" aria-label="Open menu" aria-expanded="false">☰</button></div><div class="mobile-nav" hidden><a href="/#how">How it works</a><a href="/#payouts">Payouts</a><a href="/login.html">Log in</a><a class="button primary" href="/register.html">Get started</a></div></header>
<main class="public-main"><div class="container public-container"><section class="auth-card card"><div class="eyebrow">PASSWORD RESET</div><h1>Create a new password.</h1><p class="public-intro" style="margin-bottom:28px">Enter the 6-digit code from your email, then choose a new password.</p><form id="resetForm" class="auth-form"><div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div><label for="code">Reset code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" placeholder="123456" required></div><div><label for="password">New password</label><div class="password-field"><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button></div></div><div><label for="confirmPassword">Confirm new password</label><div class="password-field"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again" required><button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false">Show</button></div></div><button class="button primary button-lg" type="submit">Reset password</button></form><p id="message" class="form-message muted" aria-live="polite"></p><div class="auth-divider"></div><p class="auth-switch muted"><a href="/login.html">Back to sign in</a></p></section></div></main>
<footer class="public-footer"><div class="container footer-inner"><span>© 2026 LilianTech</span><nav aria-label="Footer navigation"><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/faq.html">FAQ</a><a href="/privacy.html">Privacy Policy</a><a href="/terms.html">Terms of Service</a></nav></div></footer>
<script>
(function(){const h=document.querySelector('.site-header'),b=h?.querySelector('.mobile-menu'),m=h?.querySelector('.mobile-nav');if(b&&m)b.onclick=()=>{const o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!o));m.hidden=o;};})();
function setupPasswordToggle(button){const input=document.getElementById(button.dataset.passwordToggle);button.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'Hide':'Show';button.setAttribute('aria-label',show?'Hide password':'Show password');button.setAttribute('aria-pressed',String(show));input.focus();});}document.querySelectorAll('[data-password-toggle]').forEach(setupPasswordToggle);
const params=new URLSearchParams(location.search),emailParam=(params.get('email')||'').trim().toLowerCase();document.getElementById('email').value=emailParam;
const form=document.getElementById('resetForm'),msg=document.getElementById('message'),btn=form.querySelector('button[type="submit"]');form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),code=document.getElementById('code').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;if(password.length<8){msg.textContent='Password must be at least 8 characters.';return}if(password!==confirm){msg.textContent='The passwords do not match.';return}btn.disabled=true;msg.textContent='Resetting your password…';try{const r=await fetch('/api/password-reset/complete',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email,code,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to reset your password.');msg.textContent=d.message||'Password reset successfully.';setTimeout(()=>location.replace(d.redirect||'/login.html?reset=1'),700);}catch(err){msg.textContent=err.message||'Unable to reset your password right now.';btn.disabled=false;}});
</script></body></html>
