<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — LilianTech</title>
  <link rel="stylesheet" href="/styles.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4309684826920301"
     crossorigin="anonymous"></script>
</head>
<body class="auth-page">
  <header class="site-header auth-header">
    <div class="container nav">
      <a class="brand" href="/" aria-label="LilianTech home">Lilian<span>Tech</span></a>
      <a class="button secondary" href="/login.html">Sign in</a>
    </div>
  </header>
  <main class="auth-main">
    <div class="container auth-container">
      <section class="auth-card card">
        <div class="eyebrow">GET STARTED</div>
        <h1>Create your LilianTech account.</h1>
        <p class="muted">Join free and see the opportunities available to you.</p>
        <form id="registerForm" class="auth-form">
          <div><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text" placeholder="Your full name" autocomplete="name" required></div>
          <div><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
          <div><label for="password">Password</label><input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required></div>
          <label class="consent-row"><input id="termsAccepted" type="checkbox" required> <span>I agree to the <a href="/terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label><button class="button primary" type="submit">Create account</button>
        </form>
        <p id="message" class="form-message muted" aria-live="polite"></p>
        <p class="auth-switch muted">Already registered? <a href="/login.html">Sign in</a></p>
      </section>
    </div>
  </main>
  <footer><div class="container footer-inner"><span>© 2026 LilianTech</span><nav><a href="/privacy.html">Privacy Policy</a><a href="/terms.html">Terms of Service</a><a href="mailto:support@liliantech.online">Support</a></nav></div></footer>
  <script>
    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');
    const submitButton = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Creating your account…';
      submitButton.disabled = true;

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const termsAccepted = document.getElementById('termsAccepted').checked;

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          credentials: 'same-origin',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            fullName,
            email,
            password,
            termsAccepted,
            privacyAccepted: termsAccepted
          })
        });

        const raw = await response.text();
        let data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch (_) {}

        if (!response.ok) {
          message.textContent = data.error || `Unable to create account (HTTP ${response.status}).`;
          submitButton.disabled = false;
          return;
        }

        message.textContent = 'Account created successfully. Opening sign in…';
        window.location.href = '/login.html?registered=1';
      } catch (error) {
        console.error('Registration request failed:', error);
        message.textContent = 'Unable to connect right now. Please check your internet connection and try again.';
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
