<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d5dfc"><title>Forgot password — LilianTech</title><link rel="stylesheet" href="/styles.css"></head>
<body class="public-page page-enter">
<header class="site-header"><div class="container nav"><a class="brand" href="/" aria-label="LilianTech home">Lilian<span>Tech</span></a><nav class="desktop-nav" aria-label="Main navigation"><a href="/#how">How it works</a><a href="/#payouts">Payouts</a><a href="/login.html">Log in</a><a class="button primary" href="/register.html">Get started</a></nav><button class="mobile-menu" type="button" aria-label="Open menu" aria-expanded="false">☰</button></div><div class="mobile-nav" hidden><a href="/#how">How it works</a><a href="/#payouts">Payouts</a><a href="/login.html">Log in</a><a class="button primary" href="/register.html">Get started</a></div></header>
<main class="public-main"><div class="container public-container"><section class="auth-card card"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Forgot your password?</h1><p class="public-intro" style="margin-bottom:28px">Enter your email and we’ll send you a secure code to create a new password.</p><form id="forgotForm" class="auth-form"><div><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><button class="button primary button-lg" type="submit">Send reset code</button></form><p id="message" class="form-message muted" aria-live="polite"></p><div class="auth-divider"></div><p class="auth-switch muted"><a href="/login.html">Back to sign in</a></p></section></div></main>
<footer class="public-footer"><div class="container footer-inner"><span>© 2026 LilianTech</span><nav aria-label="Footer navigation"><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/faq.html">FAQ</a><a href="/privacy.html">Privacy Policy</a><a href="/terms.html">Terms of Service</a></nav></div></footer>
<script>
(function(){const h=document.querySelector('.site-header'),b=h?.querySelector('.mobile-menu'),m=h?.querySelector('.mobile-nav');if(b&&m)b.onclick=()=>{const o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!o));m.hidden=o;};})();
const form=document.getElementById('forgotForm'),msg=document.getElementById('message'),btn=form.querySelector('button');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Sending your reset code…';const email=document.getElementById('email').value.trim().toLowerCase();try{const r=await fetch('/api/password-reset/start',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to send a reset code.');msg.textContent=d.message||'If an account exists for that email, a password reset code has been sent.';if(r.ok)setTimeout(()=>{location.href='/reset-password.html?email='+encodeURIComponent(email)},900);}catch(err){msg.textContent=err.message||'Unable to send a reset code right now.';}finally{btn.disabled=false;}});
</script></body></html>
