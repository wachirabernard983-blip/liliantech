<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — LilianTech</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <header class="site-header auth-header">
    <div class="container nav">
      <a class="brand" href="/" aria-label="LilianTech home">Lilian<span>Tech</span></a>
      <a class="button secondary" href="/register.html">Create account</a>
    </div>
  </header>
  <main class="auth-main">
    <div class="container auth-container">
      <section class="auth-card card">
        <div class="eyebrow">WELCOME BACK</div>
        <h1>Sign in to LilianTech.</h1>
        <p class="muted">Pick up where you left off.</p>
        <form id="loginForm" class="auth-form">
          <div><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
          <div><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required></div>
          <button class="button primary" type="submit">Sign in</button>
        </form>
        <p id="message" class="form-message muted" aria-live="polite"></p>
        <p class="auth-switch muted">New here? <a href="/register.html">Create an account</a></p>
      </section>
    </div>
  </main>
  <footer><div class="container footer-inner"><span>© 2026 LilianTech</span></div></footer>
  <script>
    const form=document.getElementById('loginForm');const message=document.getElementById('message');
    form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='Signing in…';const email=document.getElementById('email').value;const password=document.getElementById('password').value;try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',cache:'no-store',body:JSON.stringify({email,password})});const data=await response.json();if(!response.ok){message.textContent=data.error||'Invalid email or password.';return;}window.location.replace('/dashboard.html');}catch(error){console.error(error);message.textContent='Unable to connect right now. Please try again.';}});
  </script>
</body>
</html>
