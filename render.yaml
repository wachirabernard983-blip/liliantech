services:
  - type: web
    name: liliantech
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MIN_WITHDRAWAL
        value: "25"
      - key: ADMIN_EMAIL
        value: "wachirabernard193@gmail.com"
      - key: ADMIN_NAME
        value: "Bernard Wachira"
      - key: CPX_APP_ID
        value: "35372"
      - key: CPX_SECURE_HASH
        sync: false
      - key: BITLABS_API_TOKEN
        sync: false
      - key: BITLABS_APP_SECRET
        sync: false
      - key: CINT_JWT
        sync: false
      - key: DYNATA_ACCESS_KEY
        sync: false
      - key: DYNATA_SECRET_KEY
        sync: false
      - key: MPESA_ENV
        value: "sandbox"
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_INITIATOR_NAME
        sync: false
      - key: MPESA_SECURITY_CREDENTIAL
        sync: false
      - key: MPESA_RESULT_URL
        sync: false
      - key: MPESA_TIMEOUT_URL
        sync: false
      - key: USD_TO_KES
        value: "130"
      - key: PAYPAL_ENV
        value: "sandbox"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SENDER_EMAIL
        sync: false
      - key: WISE_API_TOKEN
        sync: false
      - key: PAYONEER_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
