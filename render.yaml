services:
  - type: web
    name: liliantech
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MIN_WITHDRAWAL
        value: "25"
      - key: ADMIN_EMAIL
        value: "wachirabernard193@gmail.com"
      - key: ADMIN_EMAILS
        value: "wachirabernard983@gmail.com,stellawanjiku90@gmail.com,wachirabernard193@gmail.com"
      - key: ADMIN_NAME
        value: "Bernard Wachira"
      - key: REWARD_SHARE
        value: "0.70"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_QUESTION_MODEL
        value: "gpt-5.6-luna"
      - key: AI_QUESTION_REWARD
        value: "0.001"
      - key: AI_QUESTION_BATCH_SIZE
        value: "30"
      - key: AI_QUESTION_PREFETCH
        value: "30"
      - key: SURVEY_MAX_RESPONSES
        value: "1000"
      - key: SURVEY_PREFETCH
        value: "5"
      - key: NOTIFICATION_EMAIL_ENABLED
        value: "true"
      - key: NOTIFICATION_PUSH_ENABLED
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFICATION_FROM
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:notifications@liliantech.online"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: PAYPAL_ENV
        value: "sandbox"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SENDER_EMAIL
        sync: false
      - key: WISE_API_TOKEN
        sync: false
      - key: PAYONEER_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
