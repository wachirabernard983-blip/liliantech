services:
  - type: web
    name: liliantech
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MIN_WITHDRAWAL
        value: "25"
      - key: ADMIN_EMAIL
        value: "wachirabernard193@gmail.com"
      - key: ADMIN_NAME
        value: "Bernard Wachira"
      - key: REWARD_SHARE
        value: "0.70"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_QUESTION_MODEL
        value: "gpt-5.6-luna"
      - key: AI_QUESTION_REWARD
        value: "0.005"
      - key: AI_QUESTION_BATCH_SIZE
        value: "15"
      - key: AI_QUESTION_PREFETCH
        value: "10"
      - key: PAYPAL_ENV
        value: "sandbox"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SENDER_EMAIL
        sync: false
      - key: WISE_API_TOKEN
        sync: false
      - key: PAYONEER_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
