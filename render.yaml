services:
  - type: web
    name: liliantech
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MIN_WITHDRAWAL
        value: "25"
      - key: ADMIN_EMAIL
        value: "wachirabernard193@gmail.com"
      - key: ADMIN_NAME
        value: "Bernard Wachira"
      - key: CPX_APP_ID
        value: "35372"
      - key: REWARD_SHARE
        value: "0.70"
      - key: CPX_REWARD_SHARE
        value: "0.70"
      - key: BITLABS_REWARD_SHARE
        value: "0.70"
      - key: THEOREMREACH_EXCHANGE_RATE
        value: "100"
      - key: THEOREMREACH_API_KEY
        sync: false
      - key: THEOREMREACH_SECRET_KEY
        sync: false
      - key: THEOREMREACH_ENTRY_URL
        sync: false
      - key: THEOREMREACH_SURVEYS_API_URL
        sync: false
      - key: CPX_SECURE_HASH
        sync: false
      - key: BITLABS_API_TOKEN
        sync: false
      - key: BITLABS_APP_SECRET
        sync: false
      - key: BITLABS_POINTS_PER_USD
        sync: false
      - key: CINT_JWT
        sync: false
      - key: DYNATA_ACCESS_KEY
        sync: false
      - key: DYNATA_SECRET_KEY
        sync: false
      - key: PAYPAL_ENV
        value: "sandbox"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SENDER_EMAIL
        sync: false
      - key: WISE_API_TOKEN
        sync: false
      - key: PAYONEER_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
